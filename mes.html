<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendario-Mes</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="headerMes">
    <a href="index.html" class="btnVolver">Volver al calendario</a>
    <h1 id="nombreMes"></h1>
  </header>

  <main>
    <section class="seccionNotas">
      <form id="formularioNotas">
        <div>
          <input type="text" id="tituloNota" placeholder="Título de la nota"></br>
          <textarea id="descNota" placeholder="Descripción de la nota"></textarea>
        </div>
        <button id="addNota">Añadir nota</button>
      </form>
      <div id="errorMensaje"></div>      
    </section>

  
    <section class="seccionResult">
      <ul id="listaNotas"></ul>
    </section>
  

  </main>

  <script src="js/app_mes.js"></script>
</body>
</html>
